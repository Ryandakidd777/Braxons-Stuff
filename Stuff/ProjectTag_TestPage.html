    <style>
      .project_label {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 14px;
        margin: 10px 0;
        color: #c9d1d9;
        transition: 0.2s ease;
      }

      .project_label:hover {
        border-color: #58a6ff;
        transform: translateY(-2px);
      }

      .project_progress_tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        border: 1px solid;
      }

      #not-started {
        color: #8b949e;
        border-color: rgba(139, 148, 158, 0.4);
        background: rgba(139, 148, 158, 0.08);
      }

      #wip {
        color: #d29922;
        border-color: rgba(210, 153, 34, 0.4);
        background: rgba(210, 153, 34, 0.08);
      }

      #success {
        color: #3fb950;
        border-color: rgba(63, 185, 80, 0.4);
        background: rgba(63, 185, 80, 0.08);
      }

      .dot {
        width: 8px;
        height: 8px;
        background: currentColor;
        border-radius: 50%;
      }

      .icon svg {
        width: 12px;
        height: 12px;
      }

      .spinner {
        stroke: currentColor;
        opacity: 0.5;
      }

      .spinner circle {
        stroke-dasharray: 30;
        stroke-dashoffset: 10;
        animation: spin 1s linear infinite;
        transform-origin: center;
      }

      .check {
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .projects_container {
        max-width: 450px;
        margin: 0 auto;
        padding: 20px;
      }

      .project_image {
        width: 100%;
        margin-bottom: 10px;
      }

      .project_image img {
        width: 100%;
        height: auto;
        border-radius: 8px;
        display: block;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
    </style>

    <script src="/js/mainGlobal.js" defer></script>
    <script src="/js/headerLoader.js" defer></script>

    <main class="main">
      <header id="page-title">
        <header>Test Page - Project Tags</header>

        <p id="description">
          Great things on their way! Stay tuned!
        </p>
      </header>

      <section id="section">
        <h2>
          <a href="/">Return Home</a>

        <div class="tags-container">
          <div class="project_progress_tag" id="not-started">
            <span class="dot"></span>
            Not started

          <div class="project_progress_tag" id="wip">
            <span class="icon">
              <svg viewBox="0 0 16 16" class="spinner">
                <circle
                  cx="8"
                  cy="8"
                  r="6"
                  fill="none"
                  stroke-width="2"
                ></circle>
              </svg>
            </span>

            In progress
          </div>

          <div class="project_progress_tag" id="success">
            <span class="icon">
              <svg viewBox="0 0 16 16" class="check">
                <path
                  d="M3 8l3 3 7-7"
                  fill="none"
                  stroke-width="2"

              </svg>
            </span>

          </div>
        </div>

        <div class="image-container">
          <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">

              width="427"

      </section>

      <section class="projects_container">
