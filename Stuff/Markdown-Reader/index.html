    <title>Markdown Reader</title>

    <link rel="stylesheet" href="/css/mainGlobal.css">
    <link rel="stylesheet" href="/css/markdownReader.css">

<body>
<noscript>
  <div class="noscript-banner">
    ⚠ JavaScript is disabled. Some features of this website may not work correctly.
    Learn how to enable JavaScript here:
    <a href="https://support.google.com/adsense/answer/12654?hl=en" target="_blank" rel="noopener">
      Enable JavaScript Instructions
    </a>
  </div>
</noscript>
<div class="main">
    <div id="page-title">
        <header>Markdown Reader</header>
    </div>

    <section id="Reader">
        <div class="reader-toolbar">
            <span class="reader-filename" id="reader-filename">untitled.md</span>
            <div class="reader-actions">
                <button id="reader-edit-btn" type="button">Edit</button>
                <button id="reader-clear-btn" type="button">Clear</button>
            </div>
        </div>

        <div id="reader-pane">
            <p id="reader-placeholder">Drop a markdown file here, or click Edit to paste text</p>
            <textarea id="reader-input" spellcheck="false"></textarea>
            <article id="reader-output"></article>
        </div>

        <input type="file" id="reader-file-input" accept=".md,.markdown,.txt">
    </section>
</div>
</body>
